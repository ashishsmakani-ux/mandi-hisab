<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>આશિષ માકાણી - મંડી હિસાબ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 

<div class="container">
    <div class="brand-header">
        <h1>આશિષ માકાણી</h1>
        <p style="margin:0">મંડી હિસાબ સોફ્ટવેર</p>
    </div> 

    <div class="grading-type-box">
        <label>ગ્રેડિંગ કોણે કર્યું?</label>
        <select id="gradingMode" class="grading-select">
            <option value="mandi">મંડી ગ્રેડિંગ (ચાર્જ ₹13)</option>
            <option value="farmer">ખેડૂત ગ્રેડિંગ (ચાર્જ ફ્રી)</option>
        </select>
    </div>

    <div class="master-controls">
        <button class="master-btn" onclick="setAllTypes('20')">બધા ૨૦ કિલો કરો</button>
        <button class="master-btn" onclick="setAllTypes('1')">બધા ૧ કિલો કરો</button>
    </div> 

    <div class="header-row">
        <div style="flex:0.4">નં.</div>
        <div style="flex:1.5">વજન</div>
        <div style="flex:1.5">ભાવ</div>
        <div style="flex:1.2">એકમ</div>
        <div style="flex:1.5">1 kg ભાવ</div>
    </div>
    
    <form id="calcForm">
        <div id="grades-container"></div>
    </form> 

    <div class="btn-group">
        <button class="btn-calc" onclick="calculate()">હિસાબ કરો</button>
        <button class="btn-clear" onclick="resetForm()">ક્લીઅર</button>
    </div> 

    <div id="results" class="result-box">
        <p><span>કુલ વજન:</span> <span id="resW">0</span></p>
        <p><span>કુલ વેચાણ:</span> <span id="resS">0</span></p>
        <p><span>ખર્ચ (ગ્રેડીંગ + લોડીંગ):</span> <span id="resExp">0</span></p>
        <p><span>મંડી ચાર્જ (3%):</span> <span id="resM">0</span></p>
        <p style="color:#1b5e20; font-weight:bold; border:none"><span>ચોખ્ખી આવક:</span> <span id="resNet">0</span></p>
        <div class="total-highlight" id="resAvg">સરેરાશ: ₹ 0 /kg</div>
    </div> 

    <div class="footer">Developed by: Ashish Makani</div>
</div> 

<div id="ad-banner-container">જાહેરાત લોડ થઈ રહી છે...</div>

<script src="script.js"></script>
</body>
</html>
